output:
  ckpt_dir_name: "ckpt"
  log_dir_name: "log"

optimizer:
  init_lr: 0.01
  betas: [0.9, 0.98]
  eps: 0.000000001
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 4000
  anneal_steps: [300000, 400000, 500000]
  anneal_rate: 0.3
step:
  batch_size: 16
  total_step: 400000
  log_step: 100
  synth_step: 1000
  val_step: 1000
  save_step: 1000
loss:
  lambda_pos: 1
  lambda_neg: 1
  loss_space: "embedding"   # "embedding" or "scalar"