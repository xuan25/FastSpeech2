path:
  base_dir: "../data/MELD.tar"
  meta_file_train: "train.csv"
  meta_file_val: "dev.csv"
  speaker_map_file: "speakers.json"
  feature_dir: ""
  stats_file: "stats.json"
  label_file: "../meld_sentiment.csv"

properties:
  pitch_feature_level: "phoneme_level" # support 'phoneme_level' or 'frame_level'
  energy_feature_level: "phoneme_level" # support 'phoneme_level' or 'frame_level'
  n_mel_channels: 80
  max_wav_value: 32768.0
  sampling_rate: 22050
  stft_hop_length: 256
  num_label_categories: 3

preprocessing:
  # lexicon_path: "../../lexicon/librispeech-lexicon.txt"
  lexicon_path: ""
  text_cleaners: ["english_cleaners"]
